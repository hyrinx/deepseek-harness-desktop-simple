name: Sync Release to Gitee

# 触发方式：
#   - release: published —— 仅对"用户手动发布"或"非 GITHUB_TOKEN 发布"生效。
#     ⚠️ 由仓库内 release.yml 用默认 GITHUB_TOKEN 创建的 Release，其 release 事件会被
#        GitHub 抑制(避免循环触发)，不会进入这里；这种情况下改手工调动 release.yml
#        末尾"显式触发同步"这一步(workflow_dispatch)来做，见 release.yml。
#   - workflow_dispatch —— 手动触发：默认读取 GitHub 最新已发布 Release 同步到 Gitee，
#     也可通过输入参数 tag 指定要同步的版本(为空则取最新)。
#
# 目标：把 GitHub 某个 Release 的 tag + 安装包资产 + 发布说明同步到同名 Gitee 仓库的发行版，
#   使"GitHub 发布、Gitee 自动跟随"。不再依赖 github.event.release，运行时用 gh 解析，
#   因此手动触发也能正确同步。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要同步的 Release tag(留空=取 GitHub 最新已发布 Release)'
        required: false
        default: ''

permissions:
  contents: read

env:
  # 改成你在 Gitee 的空间地址(path)与仓库路径 —— 与你从 GitHub 导入 Gitee 时填的一致。
  # 常见就是 GitHub 同名用户名 + 同名仓库名;若不一致请一定改这里。
  GITEE_OWNER: hyrinx
  GITEE_REPO: deepseek-harness-desktop-simple
  # 需要你在 Gitee 生成私人令牌,存到本仓库的 Secrets → GITEE_TOKEN
  GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 拿全历史与 tag:既用于把 tag 推到 Gitee,也用于核对
          fetch-depth: 0

      - name: 解析目标 Release(tag 为空则取最新)
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          REPO="${{ github.repository }}"
          INPUT_TAG="${{ inputs.tag }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            # 最新"已发布"(非 draft、非 prerelease 也允许含 prerelease)的 tag
            TAG="$(gh release list --repo "$REPO" --limit 1 --json tagName --exclude-drafts --exclude-pre-releases --jq '.[0].tagName')"
          fi
          [ -n "$TAG" ] || { echo "::error::未找到可同步的 Release"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # 拿到该 release 的 target commit(创建 Gitee release 时用)与正文
          echo "target_commitish=$(gh release view "$TAG" --repo "$REPO" --json targetCommitish --jq '.targetCommitish')" >> "$GITHUB_OUTPUT"
          echo "body=$(gh release view "$TAG" --repo "$REPO" --json body --jq '.body // ""')" >> "$GITHUB_OUTPUT"
          echo "prerelease=$(gh release view "$TAG" --repo "$REPO" --json isPrerelease --jq '.isPrerelease')" >> "$GITHUB_OUTPUT"
          echo "解析结果: tag=$TAG target_commitish=${{ steps.target.outputs.target_commitish }}"
      - name: 从 GitHub Release 下载资产
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          mkdir -p assets
          gh release download "${{ steps.target.outputs.tag }}" --repo "${{ github.repository }}" --dir assets
          echo "--- 已下载资产 ---"
          ls -la assets
          echo "--------------------"

      - name: 确保 Gitee 存在同名 tag
        # 把该 tag(与发布提交绑定)推到 Gitee,使 Gitee 侧 release 能定位到正确 commit。
        # 若 Gitee 仓库尚未拉过此 tag,Gitee release 的 tag 会指向默认分支头,顺序高于 release 本身。
        if: env.GITEE_TOKEN != ''
        env:
          GITEE_REMOTE: https://hyrinx:${{ env.GITEE_TOKEN }}@gitee.com/${{ env.GITEE_OWNER }}/${{ env.GITEE_REPO }}.git
        run: |
          set -eo pipefail
          TAG="${{ steps.target.outputs.tag }}"
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git push "$GITEE_REMOTE" "refs/tags/$TAG"

      - name: 判断 Gitee Release 是否已存在(幂等)
        if: env.GITEE_TOKEN != ''
        env:
          TOKEN: "${{ env.GITEE_TOKEN }}"
        run: |
          OWNER="${{ env.GITEE_OWNER }}"
          REPO="${{ env.GITEE_REPO }}"
          TAG="${{ steps.target.outputs.tag }}"
          CODE=$(curl -s -o /tmp/gitee_rel.json -w '%{http_code}' \
            "https://gitee.com/api/v5/repos/$OWNER/$REPO/releases/tags/$TAG?access_token=$TOKEN")
          if [ "$CODE" = "200" ]; then
            echo "::notice::Gitee Release $TAG 已存在,跳过创建与上传"
            echo "gitee_exists=true" >> "$GITHUB_ENV"
          else
            echo "gitee_exists=false" >> "$GITHUB_ENV"
          fi

      - name: 创建 Gitee Release 并上传资产
        if: env.GITEE_TOKEN != '' && env.gitee_exists == 'false'
        env:
          TOKEN: "${{ env.GITEE_TOKEN }}"
          RELEASE_BODY: "${{ steps.target.outputs.body }}"
        run: |
          set -eo pipefail
          OWNER="${{ env.GITEE_OWNER }}"
          REPO="${{ env.GITEE_REPO }}"
          TAG="${{ steps.target.outputs.tag }}"
          PRERELEASE="${{ steps.target.outputs.prerelease }}"
          TARGET_COMMITISH="${{ steps.target.outputs.target_commitish }}"

          # 发布说明多行文本用 python 做 JSON 安全编码,避免引号/换行破坏请求体
          BODY_JSON=$(python3 -c "import json,os;print(json.dumps(os.environ['RELEASE_BODY']))")
          cat > /tmp/req.json <<JSON
          {"access_token":"$TOKEN","tag_name":"$TAG","name":"$TAG","body":$BODY_JSON,"prerelease":$PRERELEASE,"target_commitish":"$TARGET_COMMITISH"}
          JSON

          RESP=$(curl -s -X POST -H "Content-Type: application/json;charset=UTF-8" \
            --data @/tmp/req.json \
            "https://gitee.com/api/v5/repos/$OWNER/$REPO/releases")
          echo "$RESP" | python3 -m json.tool > /dev/null
          ID=$(echo "$RESP" | python3 -c "import json,sys;print(json.load(sys.stdin)['id'])")
          echo "Gitee Release id=$ID"

          # 上传附件(multipart/form-data);逐个上传,失败的不阻断其余文件
          FAIL=0
          cd assets
          for f in *; do
            [ -f "$f" ] || continue
            echo "==> 上传 $f"
            HTTP=$(curl -s -o /tmp/up.json -w '%{http_code}' -X POST \
              -F "access_token=$TOKEN" \
              -F "file=@$f;filename=$f" \
              "https://gitee.com/api/v5/repos/$OWNER/$REPO/releases/$ID/attach_files")
            if [ "$HTTP" != "201" ] && [ "$HTTP" != "200" ]; then
              echo "::error::上传 $f 失败 ($HTTP): $(cat /tmp/up.json)"
              FAIL=1
            fi
          done
          [ "$FAIL" = "0" ]

      - name: 完成(Gitee 已存在时提示)
        if: env.GITEE_TOKEN != '' && env.gitee_exists == 'true'
        run: echo "Gitee Release ${{ steps.target.outputs.tag }} 已存在,本次无需操作。如需强制同步,可删除 Gitee 该发行版后重新触发。"