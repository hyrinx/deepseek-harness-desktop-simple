name: Sync Release to Gitee

# 每当 GitHub 发布(release published)时触发,把本次 Release 的 tag + 安装包资产 + 发布说明
# 通过 Gitee OpenAPI 同步到同名 Gitee 仓库的发行版(Release),实现"GitHub 发布、Gitee 自动跟随"。

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  # 改成你在 Gitee 的空间地址(path)与仓库路径 —— 与你从 GitHub 导入 Gitee 时填的一致。
  # 常见就是 GitHub 同名用户名 + 同名仓库名;若不一致请一定改这里。
  GITEE_OWNER: hyrinx
  GITEE_REPO: deepseek-harness-desktop-simple
  # 需要你在 Gitee 生成私人令牌,存到本仓库的 Secrets → GITEE_TOKEN
  GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 拿全历史与 tag:既用于把 tag 推到 Gitee,也用于核对
          fetch-depth: 0

      - name: 从 GitHub Release 下载资产
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets
          gh release download "${{ github.event.release.tag_name }}" --repo "${{ github.repository }}" --dir assets
          echo "--- 已下载资产 ---"
          ls -la assets
          echo "--------------------"

      - name: 确保 Gitee 存在同名 tag
        # 把该 tag(与发布提交绑定)推到 Gitee,使 Gitee 侧 release 能定位到正确 commit。
        # 若 Gitee 仓库尚未拉过此 tag,Gitee release 的 tag 会指向默认分支头,顺序高于 release 本身。
        if: env.GITEE_TOKEN != ''
        env:
          GITEE_REMOTE: https://gitee.com/${{ env.GITEE_OWNER }}/${{ env.GITEE_REPO }}.git
        run: |
          TAG="${{ github.event.release.tag_name }}"
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git push "$GITEE_REMOTE" "refs/tags/$TAG"

      - name: 判断 Gitee Release 是否已存在(幂等)
        if: env.GITEE_TOKEN != ''
        env:
          TOKEN: "${{ env.GITEE_TOKEN }}"
        run: |
          OWNER="${{ env.GITEE_OWNER }}"
          REPO="${{ env.GITEE_REPO }}"
          TAG="${{ github.event.release.tag_name }}"
          CODE=$(curl -s -o /tmp/gitee_rel.json -w '%{http_code}' \
            "https://gitee.com/api/v5/repos/$OWNER/$REPO/releases/tags/$TAG?access_token=$TOKEN")
          if [ "$CODE" = "200" ]; then
            echo "::notice::Gitee Release $TAG 已存在,跳过创建与上传"
            echo "gitee_exists=true" >> "$GITHUB_ENV"
          else
            echo "gitee_exists=false" >> "$GITHUB_ENV"
          fi

      - name: 创建 Gitee Release 并上传资产
        if: env.GITEE_TOKEN != '' && env.gitee_exists == 'false'
        env:
          TOKEN: "${{ env.GITEE_TOKEN }}"
          RELEASE_BODY: "${{ github.event.release.body }}"
        run: |
          set -eo pipefail
          OWNER="${{ env.GITEE_OWNER }}"
          REPO="${{ env.GITEE_REPO }}"
          TAG="${{ github.event.release.tag_name }}"
          PRERELEASE="${{ github.event.release.prerelease }}"
          TARGET_COMMITISH="${{ github.event.release.target_commitish }}"

          # 发布说明多行文本用 python 做 JSON 安全编码,避免引号/换行破坏请求体
          BODY_JSON=$(python3 -c "import json,os;print(json.dumps(os.environ['RELEASE_BODY']))")
          cat > /tmp/req.json <<JSON
          {"access_token":"$TOKEN","tag_name":"$TAG","name":"$TAG","body":$BODY_JSON,"prerelease":$PRERELEASE,"target_commitish":"$TARGET_COMMITISH"}
          JSON

          RESP=$(curl -s -X POST -H "Content-Type: application/json;charset=UTF-8" \
            --data @/tmp/req.json \
            "https://gitee.com/api/v5/repos/$OWNER/$REPO/releases")
          echo "$RESP" | python3 -m json.tool > /dev/null
          ID=$(echo "$RESP" | python3 -c "import json,sys;print(json.load(sys.stdin)['id'])")
          echo "Gitee Release id=$ID"

          # 上传附件(multipart/form-data);逐个上传,失败的不阻断其余文件
          FAIL=0
          cd assets
          for f in *; do
            [ -f "$f" ] || continue
            echo "==> 上传 $f"
            HTTP=$(curl -s -o /tmp/up.json -w '%{http_code}' -X POST \
              -F "access_token=$TOKEN" \
              -F "file=@$f;filename=$f" \
              "https://gitee.com/api/v5/repos/$OWNER/$REPO/releases/$ID/attach_files")
            if [ "$HTTP" != "201" ] && [ "$HTTP" != "200" ]; then
              echo "::error::上传 $f 失败 ($HTTP): $(cat /tmp/up.json)"
              FAIL=1
            fi
          done
          [ "$FAIL" = "0" ]

      - name: 完成(Gitee 已存在时提示)
        if: env.GITEE_TOKEN != '' && env.gitee_exists == 'true'
        run: echo "Gitee Release ${{ github.event.release.tag_name }} 已存在,本次无需操作。如需强制同步,可删除 Gitee 该发行版后重新发布。"