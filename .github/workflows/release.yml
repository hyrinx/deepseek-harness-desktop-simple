name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '版本号（如 v1.2.0）'
        required: true
        type: string

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_flag: --linux
            artifact_name: linux
          - os: macos-latest
            build_flag: --mac
            artifact_name: macos
          - os: windows-latest
            build_flag: --win
            artifact_name: windows
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        run: npm ci

      - name: 构建 (${{ matrix.os }})
        # 显式 --publish never:禁止 electron-builder 隐性上传 Release
        # (否则会用只读的 GITHUB_TOKEN 写 Releases API 触发 403),发布交由下方 action-gh-release
        run: npx electron-builder ${{ matrix.build_flag }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # 关键:显式检出目标 tag(wf_dispatch 下默认 ref 是 main,会导致 git log 对比区间塌缩成空)
          ref: ${{ inputs.tag_name || github.ref }}
          # 需要完整历史与 tag：用于按“上一个 tag”区间自动生成发布说明
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: 列出产物
        run: ls -R dist/

      - name: 生成发布说明(更新内容)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          TAG="${{ inputs.tag_name || github.ref_name }}"
          # 上一版本 tag(完整历史由 checkout 的 fetch-depth: 0 提供),用于生成分类更新记录
          PREV="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"

          # 依 conventional commit 前缀,把自上一版本以来的提交归类到各分类区块;
          # 标题已体现分类,归类时去掉 "feat:/fix:..." 等前缀
          FEAT=(); FIX=(); OPT=(); OTH=()
          if [ -n "$PREV" ]; then
            while IFS= read -r subj; do
              case "$subj" in
                feat:*)                       FEAT+=("${subj#*: }") ;;
                fix:*)                        FIX+=("${subj#*: }") ;;
                refactor:*|perf:*|style:*|docs:*|chore:*|ci:*|test:*|build:*|release:*) OPT+=("${subj#*: }") ;;
                *)                            OTH+=("$subj") ;;
              esac
            done < <(git log --pretty=format:%s "$PREV..$TAG")
          fi

          # 组装分类正文(空分类自动跳过)
          NOTES_FILE="$(mktemp)"
          emit() { local title="$1"; shift; local -a arr=("$@"); [ ${#arr[@]} -eq 0 ] && return; printf '\n### %s\n' "$title" >> "$NOTES_FILE"; local i; for i in "${arr[@]}"; do printf '* %s\n' "$i" >> "$NOTES_FILE"; done; }
          emit "✨ 新增" "${FEAT[@]}"
          emit "🔧 优化" "${OPT[@]}"
          emit "🐛 修复" "${FIX[@]}"
          emit "📋 其他" "${OTH[@]}"
          NOTES="$(<"$NOTES_FILE")"
          rm -f "$NOTES_FILE"
          [ -z "$NOTES" ] && NOTES="此版本暂无变更记录"

          # 先仅写更新内容;安装包下载表待 Release 创建并上传资产后,
          # 按 GitHub 真实托管的资产名生成(避免空格被转点号导致下载链接 404)
          {
            echo "## 📝 更新内容"
            echo
            echo "$NOTES"
          } > NOTES.md
          echo "RESULT_TAG=$TAG" >> "$GITHUB_ENV"

      - name: 发布到 GitHub Release (草稿)
        uses: softprops/action-gh-release@v2
        with:
          # 只上传安装包产物,避免把 Electron 内部框架文件(locale.pak/dll/…)也传上去
          # 参考 upload-artifact 的子目录结构: dist/<平台>/<安装包>
          files: |
            dist/*/*.exe
            dist/*/*.dmg
            dist/*/*.AppImage
            dist/*/*.deb
            dist/*/*.rpm
            dist/*/*.zip
            dist/*/*.blockmap
            dist/*/latest*.yml
          body_path: NOTES.md
          tag_name: ${{ env.RESULT_TAG }}
          draft: true

      - name: 生成安装包下载表(按真实资产)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          TAG="${{ env.RESULT_TAG }}"
          # 读取 Release 实际托管的资产下载地址,保证下载链接与上传名完全一致
          # (不直接用本地文件名拼 URL,可规避 GitHub 将文件名空格转点号导致的 404)
          gh release view "$TAG" --json assets \
            --jq '.assets[] | [.name,.browser_download_url] | @tsv' > assets.tsv

          WIN=(); MAC=(); LIN=()
          while IFS=$'\t' read -r name url; do
            lower="$(printf '%s' "$name" | tr '[:upper:]' '[:lower:]')"
            case "$lower" in
              *.exe)
                case "$lower" in
                  *setup*)    fmt="安装程序 (.exe)" ;;
                  *)          fmt="可执行文件 (.exe)" ;;
                esac
                WIN+=("$fmt|$url") ;;
              *.dmg)
                case "$lower" in
                  *arm64*) fmt="macOS 苹果芯片 (.dmg)" ;;
                  *x64*)   fmt="macOS Intel (.dmg)" ;;
                  *)       fmt="macOS (.dmg)" ;;
                esac
                MAC+=("$fmt|$url") ;;
              *.appimage) LIN+=("Linux AppImage|$url") ;;
              *.deb)      LIN+=("Linux .deb|$url") ;;
              *.rpm)      LIN+=("Linux .rpm|$url") ;;
            esac
          done < assets.tsv

          {
            echo "## 📦 安装包"
            echo
            echo "| 平台 | 格式 | 关联 |"
            echo "| --- | --- | --- |"
            for row in "${WIN[@]}"; do printf '| 🪟 Windows | %s | [下载](%s) |\n' "${row%%|*}" "${row#*|}"; done
            for row in "${MAC[@]}"; do printf '| 🍎 macOS | %s | [下载](%s) |\n' "${row%%|*}" "${row#*|}"; done
            for row in "${LIN[@]}"; do printf '| 🐧 Linux | %s | [下载](%s) |\n' "${row%%|*}" "${row#*|}"; done
          } > TABLE.md

          # 合并更新内容 + 安装包下载表
          {
            cat NOTES.md
            echo
            cat TABLE.md
          } > RELEASE_BODY.md

      - name: 更新发布正文
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ env.RESULT_TAG }}" --notes-file RELEASE_BODY.md