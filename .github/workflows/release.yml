name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '版本号（如 v1.2.0）'
        required: true
        type: string

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_flag: --linux
            artifact_name: linux
          - os: macos-latest
            build_flag: --mac
            artifact_name: macos
          - os: windows-latest
            build_flag: --win
            artifact_name: windows
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        run: npm ci

      - name: 构建 (${{ matrix.os }})
        # 显式 --publish never:禁止 electron-builder 隐性上传 Release
        # (否则会用只读的 GITHUB_TOKEN 写 Releases API 触发 403),发布交由下方 action-gh-release
        run: npx electron-builder ${{ matrix.build_flag }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: 列出产物
        run: ls -R dist/

      - name: 生成发布说明(手写模板 + 自动 Changelog)
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag_name || github.ref_name }}"
          # 用 tag 让 GitHub 依 commit/PR 生成完整变更记录(含 Contributors)
          NOTES="$(gh api -X POST "repos/${{ github.repository }}/releases/generate-notes" -f tag_name="$TAG" --jq '.body')"
          {
            echo "## 发布说明"
            echo
            cat release-template.md
            echo
            echo "### 完整变更记录(自动生成)"
            echo
            echo "$NOTES"
          } > RELEASE_BODY.md
          echo "RESULT_TAG=$TAG" >> "$GITHUB_ENV"

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 只发布安装包产物,避免把 Electron 内部框架文件(locale.pak/dll/…)也传上去
          # 参考 upload-artifact 的子目录结构: dist/<平台>/<安装包>
          files: |
            dist/*/*.exe
            dist/*/*.dmg
            dist/*/*.AppImage
            dist/*/*.deb
            dist/*/*.rpm
            dist/*/*.zip
            dist/*/*.blockmap
            dist/*/latest*.yml
          body_path: RELEASE_BODY.md
          tag_name: ${{ env.RESULT_TAG }}
          draft: true