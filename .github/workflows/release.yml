name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '版本号（如 v1.2.0）'
        required: true
        type: string

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_flag: --linux
            artifact_name: linux
          - os: macos-latest
            build_flag: --mac
            artifact_name: macos
          - os: windows-latest
            build_flag: --win
            artifact_name: windows
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        run: npm ci

      - name: 构建 (${{ matrix.os }})
        # 显式 --publish never:禁止 electron-builder 隐性上传 Release
        # (否则会用只读的 GITHUB_TOKEN 写 Releases API 触发 403),发布交由下方 action-gh-release
        run: npx electron-builder ${{ matrix.build_flag }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # 关键:显式检出目标 tag(wf_dispatch 下默认 ref 是 main,会导致 git log 对比区间塌缩成空)
          ref: ${{ inputs.tag_name || github.ref }}
          # 需要完整历史与 tag：用于按“上一个 tag”区间自动生成发布说明
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: 列出产物
        run: ls -R dist/

      - name: 生成发布说明(自动下载表 + 自动更新记录)
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          TAG="${{ inputs.tag_name || github.ref_name }}"
          # 上一版本 tag(完整历史由 checkout 的 fetch-depth: 0 提供),用于生成分类更新记录
          PREV="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          FILE_URL="https://github.com/${{ github.repository }}/releases/download"

          # 依 conventional commit 前缀,把自上一版本以来的提交归类到各分类区块
          FEAT=(); FIX=(); OPT=(); OTH=()
          if [ -n "$PREV" ]; then
            while IFS= read -r subj; do
              case "$subj" in
                feat:*)                       FEAT+=("$subj") ;;
                fix:*)                        FIX+=("$subj") ;;
                refactor:*|perf:*|style:*|docs:*|chore:*|ci:*|test:*|build:*|release:*) OPT+=("$subj") ;;
                *)                            OTH+=("$subj") ;;
              esac
            done < <(git log --pretty=format:%s "$PREV..$TAG")
          fi

          # 组装分类正文(空分类自动跳过)
          NOTES_FILE="$(mktemp)"
          emit() { local title="$1"; shift; local -a arr=("$@"); [ ${#arr[@]} -eq 0 ] && return; printf '\n### %s\n' "$title" >> "$NOTES_FILE"; local i; for i in "${arr[@]}"; do printf '* %s\n' "$i" >> "$NOTES_FILE"; done; }
          emit "✨ 新增" "${FEAT[@]}"
          emit "🔧 优化" "${OPT[@]}"
          emit "🐛 修复" "${FIX[@]}"
          emit "📋 其他" "${OTH[@]}"
          NOTES="$(<"$NOTES_FILE")"
          rm -f "$NOTES_FILE"
          [ -z "$NOTES" ] && NOTES="此版本暂无变更记录"

          # 依据实际产物文件自动生成下载表(跳过 zip/blockmap/yml 等非安装包)
          {
            echo "## 📦 安装包"
            echo
            echo "| 平台 | 格式 | 关联 |"
            echo "| --- | --- | --- |"
            for dir in windows macos linux; do
              [ -d "dist/$dir" ] || continue
              case "$dir" in
                windows) plat="🪟 Windows" ;;
                macos)   plat="🍎 macOS" ;;
                linux)   plat="🐧 Linux" ;;
              esac
              for f in "dist/$dir"/*; do
                [ -f "$f" ] || continue
                name="$(basename "$f")"
                lower="$(printf '%s' "$name" | tr '[:upper:]' '[:lower:]')"
                case "$f" in
                  *.exe)
                    case "$lower" in
                      *setup*)    fmt="安装程序 (.exe)" ;;
                      *portable*) fmt="便携版 (.exe)" ;;
                      *)          fmt="可执行文件 (.exe)" ;;
                    esac ;;
                  *.dmg)
                    case "$lower" in
                      *arm64*) fmt="macOS 苹果芯片 (.dmg)" ;;
                      *x64*)   fmt="macOS Intel (.dmg)" ;;
                      *)       fmt="macOS (.dmg)" ;;
                    esac ;;
                  *.AppImage) fmt="Linux AppImage" ;;
                  *.deb)      fmt="Linux .deb" ;;
                  *.rpm)      fmt="Linux .rpm" ;;
                  *) continue ;;
                esac
                url="$FILE_URL/$TAG/${name// /%20}"
                printf '| %s | %s | [下载](%s) |\n' "$plat" "$fmt" "$url"
              done
            done
            echo
            echo "## 📝 更新内容"
            echo
            echo "$NOTES"
          } > RELEASE_BODY.md
          echo "RESULT_TAG=$TAG" >> "$GITHUB_ENV"

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 只发布安装包产物,避免把 Electron 内部框架文件(locale.pak/dll/…)也传上去
          # 参考 upload-artifact 的子目录结构: dist/<平台>/<安装包>
          files: |
            dist/*/*.exe
            dist/*/*.dmg
            dist/*/*.AppImage
            dist/*/*.deb
            dist/*/*.rpm
            dist/*/*.zip
            dist/*/*.blockmap
            dist/*/latest*.yml
          body_path: RELEASE_BODY.md
          tag_name: ${{ env.RESULT_TAG }}
          draft: true