name: Release

on:
  # 推送 main/master 即触发:自动读取 package.json 版本号并构建发布
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # TODO(临时):以下 Linux/macOS 构建暂时注释,优先打通"发布→Gitee 同步"链路,
          # 待 Gitee 同步成功后再恢复完整三平台发布。
          # - os: ubuntu-latest
          #   build_flag: --linux
          #   artifact_name: linux
          # - os: macos-latest
          #   build_flag: --mac
          #   artifact_name: macos
          - os: windows-latest
            build_flag: --win
            artifact_name: windows
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        run: npm ci

      - name: 构建 (${{ matrix.os }})
        # 显式 --publish never:禁止 electron-builder 隐性上传 Release
        # (否则会用只读的 GITHUB_TOKEN 写 Releases API 触发 403),发布交由 gh release create
        run: npx electron-builder ${{ matrix.build_flag }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要完整历史与 tag:用于按“上一个 tag”区间自动生成发布说明
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: 识别版本号并判断是否已发布
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          V="$(node -p "require('./package.json').version")"
          TAG="v$V"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # 幂等:远程已存在同名 Release(即该版本已发布)则跳过,避免重复发布
          if gh release view "$TAG" --json tagName >/dev/null 2>&1; then
            echo "::notice::版本 $TAG 已发布,跳过本次发布"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 列出产物
        run: ls -R dist/

      - name: 生成发布说明(更新内容)
        if: steps.meta.outputs.skip == 'false'
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          # 上一版本 tag(完整历史由 checkout 的 fetch-depth: 0 提供),用于生成分类更新记录
          PREV="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"

          # 依 conventional commit 前缀,把自上一版本以来的提交归类到各分类区块
          FEAT=(); FIX=(); OPT=(); OTH=()
          if [ -n "$PREV" ]; then
            while IFS= read -r subj; do
              case "$subj" in
                feat:*)                       FEAT+=("${subj#*: }") ;;
                fix:*)                        FIX+=("${subj#*: }") ;;
                refactor:*|perf:*|style:*|docs:*|chore:*|ci:*|test:*|build:*|release:*) OPT+=("${subj#*: }") ;;
                *)                            OTH+=("$subj") ;;
              esac
            done < <(git log --pretty=format:%s "$PREV..HEAD")
          fi

          NOTES_FILE="$(mktemp)"
          emit() { local title="$1"; shift; local -a arr=("$@"); [ ${#arr[@]} -eq 0 ] && return; printf '\n### %s\n' "$title" >> "$NOTES_FILE"; local i; for i in "${arr[@]}"; do printf '* %s\n' "$i" >> "$NOTES_FILE"; done; }
          emit "✨ 新增" "${FEAT[@]}"
          emit "🔧 优化" "${OPT[@]}"
          emit "🐛 修复" "${FIX[@]}"
          emit "📋 其他" "${OTH[@]}"
          NOTES="$(<"$NOTES_FILE")"
          rm -f "$NOTES_FILE"
          [ -z "$NOTES" ] && NOTES="此版本暂无变更记录"

          {
            echo "## 📝 更新内容"
            echo
            echo "$NOTES"
          } > NOTES.md

      - name: 创建 Release 并上传资产
        if: steps.meta.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          # 直接在服务端按当前提交建 tag+Release(--target $GITHUB_SHA),
          # 不会再产生未绑定的 untagged Release,下载链接也不会为空
          gh release create "$TAG" \
            dist/*/*.exe dist/*/*.dmg dist/*/*.AppImage dist/*/*.deb dist/*/*.rpm \
            dist/*/*.zip dist/*/*.blockmap dist/*/latest*.yml \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            -F NOTES.md
          # 等待 GitHub API 索引完成,避免竞态
          sleep 5
          ASSET_COUNT=$(gh release view "$TAG" --json assets --jq '.assets | length')
          echo "已上传资产数量: $ASSET_COUNT"
          if [ "$ASSET_COUNT" -eq 0 ]; then
            echo "::error::未上传任何资产,请检查 gh release create 的通配符是否匹配到文件"
            exit 1
          fi

      - name: 生成安装包下载表(按真实资产)并更新正文
        if: steps.meta.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          BASE="https://github.com/${{ github.repository }}/releases/download/$TAG"

          # 资产下载地址由文件名与 tag 唯一确定:browser_download_url 格式固定为
          #   {repo}/releases/download/{tag}/{name}
          # 上传后该字段才由 GitHub 异步生成,为读到它而轮询会白白拖慢发布。
          # 这里直接按命名规则推导(空格在 GitHub 存储时转为点号),无需等待任何字段。
          gh release view "$TAG" --json assets \
            --jq '.assets[].name' > assets.txt

          WIN=(); MAC=(); LIN=()
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            # 按 GitHub 命名规则(空格->点号)由文件名推导下载链接
            url="${BASE}/${name// /\.}"
            lower="$(printf '%s' "$name" | tr '[:upper:]' '[:lower:]')"
            case "$lower" in
              *.exe)
                case "$lower" in
                  *setup*)    fmt="安装程序 (.exe)" ;;
                  *)          fmt="可执行文件 (.exe)" ;;
                esac
                WIN+=("$fmt|$url") ;;
              *.dmg)
                case "$lower" in
                  *arm64*) fmt="macOS 苹果芯片 (.dmg)" ;;
                  *x64*)   fmt="macOS Intel (.dmg)" ;;
                  *)       fmt="macOS (.dmg)" ;;
                esac
                MAC+=("$fmt|$url") ;;
              *.zip)
                case "$lower" in
                  *arm64*) fmt="macOS 苹果芯片 (.zip)" ;;
                  *x64*)   fmt="macOS Intel (.zip)" ;;
                  *)       fmt="macOS (.zip)" ;;
                esac
                MAC+=("$fmt|$url") ;;
              *.appimage) LIN+=("Linux AppImage|$url") ;;
              *.deb)      LIN+=("Linux .deb|$url") ;;
              *.rpm)      LIN+=("Linux .rpm|$url") ;;
            esac
          done < assets.txt

          {
            echo "## 📦 安装包"
            echo
            echo "| 平台 | 格式 | 关联 |"
            echo "| --- | --- | --- |"
            for row in "${WIN[@]}"; do printf '| 🪟 Windows | %s | [下载](%s) |\n' "${row%%|*}" "${row#*|}"; done
            for row in "${MAC[@]}"; do printf '| 🍎 macOS | %s | [下载](%s) |\n' "${row%%|*}" "${row#*|}"; done
            for row in "${LIN[@]}"; do printf '| 🐧 Linux | %s | [下载](%s) |\n' "${row%%|*}" "${row#*|}"; done
          } > TABLE.md

          # 合并更新内容 + 安装包下载表
          {
            cat NOTES.md
            echo
            cat TABLE.md
          } > RELEASE_BODY.md

          gh release edit "$TAG" --notes-file RELEASE_BODY.md

      - name: 触发 Gitee 同步发行版
        # 用 GITHUB_TOKEN 创建的 Release 不会触发 release 事件(被 GitHub 抑制),
        # 因此这里显式以 workflow_dispatch 调起 Gitee 同步工作流,把本次发行版同步到 Gitee。
        # always():即使上游"生成安装包下载表"意外失败,也不应阻断把发行版同步到 Gitee。
        if: always() && steps.meta.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run "Sync Release to Gitee" --repo "${{ github.repository }}" \
            -f tag="${{ steps.meta.outputs.tag }}"