name: Build

on:
  # 仅 PR 触发的构建校验;正式发布交由 release.yml(push main/master 自动读 package.json 版本号并构建发布),
  # 避免同一推送在两条工作流里重复三平台构建。
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_cmd: build:linux
            build_flag: --linux
          - os: macos-latest
            build_cmd: build:mac
            build_flag: --mac
          - os: windows-latest
            build_cmd: build:win
            build_flag: --win
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        run: npm ci

      - name: 构建 (${{ matrix.os }})
        # 显式 --publish never:禁止 electron-builder 隐性上传 Release
        # (否则会用只读的 GITHUB_TOKEN 写 Releases API 触发 403)
        run: npx electron-builder ${{ matrix.build_flag }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}