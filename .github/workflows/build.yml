name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  auto-tag:
    # 版本变化后自动打 tag:读取 package.json 的 version,若对应 vX.Y.Z tag 不存在则自动创建并推送,
    # 从而触发 release.yml 自动发布;版本未变化时跳过。
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 版本变化自动打 tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          V="$(node -p "require('./package.json').version")"
          TAG="v$V"
          if git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
            echo "tag $TAG 已存在,无需重复打 tag"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          echo "已自动打 tag: $TAG"
          # GITHUB_TOKEN 推送不触发 tag 工作流,需显式调度 Release 工作流
          # (workflow_dispatch 允许由 GITHUB_TOKEN 触发)
          gh workflow run "Release" -f tag_name="$TAG"
          echo "已调度 Release 工作流"

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_cmd: build:linux
            build_flag: --linux
          - os: macos-latest
            build_cmd: build:mac
            build_flag: --mac
          - os: windows-latest
            build_cmd: build:win
            build_flag: --win
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        run: npm ci

      - name: 构建 (${{ matrix.os }})
        # 显式 --publish never:禁止 electron-builder 隐性上传 Release
        # (否则会用只读的 GITHUB_TOKEN 写 Releases API 触发 403)
        run: npx electron-builder ${{ matrix.build_flag }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}